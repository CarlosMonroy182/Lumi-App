name: Android (APK de prueba y AAB para Play Store)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.LUMI_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar llave de Play Store (solo si existe el secreto)
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/lumi-upload.keystore"

      - name: Compilar AAB firmado para Play Store (solo si existe el secreto)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          LUMI_KEYSTORE: ${{ runner.temp }}/lumi-upload.keystore
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Renombrar archivos
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lumi.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab dist/Lumi-PlayStore.aab; fi
          ls -la dist

      - name: Guardar archivos en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-android
          path: dist/*

      - name: Publicar enlace de descarga directa (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dist/* --prerelease --title "Lumi (versión de prueba más reciente)" --notes "APK de prueba compilado automáticamente (build ${{ github.run_number }}). Ábrelo desde el teléfono o tablet para instalarlo."
